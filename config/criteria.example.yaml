# Copy to config/criteria.yaml and edit. This drives matching + filtering.

# Target role titles (strongest match signal).
titles:
  - Software Engineer
  - Backend Engineer
  - Full Stack Engineer
  - Platform Engineer

# Skills/keywords that should appear in a good match.
keywords:
  - Python
  - TypeScript
  - React
  - AWS
  - PostgreSQL

# Hard dealbreakers — any match here drops the job.
dealbreaker_keywords:
  - clearance
  - on-site only
  - unpaid

exclude_companies: []

# Staffing / consulting firms. These are NO LONGER dropped — they're flagged
# "⚑ staffing" in the email and demoted (staffing_penalty) so they sink to the
# bottom but you still see them.
consulting_firm_keywords:
  - apex systems
  - siri info
  - danta
  - knowledge management
  - concept plus
  - teksystems
  - cognizant
  - infosys
  - accenture
  - deloitte
  - wipro
  - tcs
  - hcl
  - capgemini
  - insight global
  - robert half

# Filters (your stated priorities).
remote_only: true
allow_hybrid: false      # flip to true later to allow hybrid
us_only: true
min_score: 40            # don't surface anything below this

# --- SailPoint-only gate + quality flagging ---
# require_sailpoint: drop anything whose primary tool isn't SailPoint. A title of
# "IAM Engineer" is fine as long as a SailPoint marker appears in the posting.
require_sailpoint: true
sailpoint_markers:
  - sailpoint
  - identityiq
  - identity iq
  - iiq
  - identitynow
  - identity now
  - identity security cloud
  - sailpoint isc

# Staffing language detected in the description → flag + demote (not drop).
staffing_signals:
  - c2c
  - corp to corp
  - corp-to-corp
  - our client
  - w2 only
  - "1099"
  - multiple positions
  - multiple openings
  - submit your resume
  - contract position
  - per hour
  - "rate:"
  - staff augmentation

# Boards that lead the digest (Tier 1). Everything else is Tier 2.
tier1_publishers:
  - linkedin
  - indeed
  - ziprecruiter

# Score penalties for demotion (jobs are flagged, never dropped, by these).
remote_penalty: 15       # applied when a posting isn't clearly remote
staffing_penalty: 20     # applied to staffing / consulting firms

# Queries sent to the broad job boards (only used if those sources are on).
adzuna_queries:
  - sailpoint iiq developer
  - sailpoint identity cloud administrator
  - sailpoint isc engineer
  - sailpoint solutions architect
  - sailpoint java developer
  - identity governance engineer
  - iam engineer remote

remotive_queries:
  - sailpoint iiq
  - sailpoint isc
  - sailpoint developer
  - sailpoint architect
  - identity governance
  - iam engineer

# JSearch queries (LinkedIn + Indeed + Glassdoor via RapidAPI).
# Requires RAPIDAPI_KEY env var. Powered by Google for Jobs.
# NOTE: don't put "remote" in JSearch queries — the source reads each posting's
# structured `job_is_remote` flag + location instead, so a role that IS remote
# but doesn't say so in the title is still caught. remote_only still filters.
jsearch_queries:
  - sailpoint iiq developer
  - sailpoint identity cloud administrator
  - sailpoint isc engineer
  - sailpoint solutions architect
  - identity governance engineer

# LLM scoring. Off by default (runs free). Turn on once you add an API key.
llm:
  enabled: false
  model: claude-haiku-4-5
  shortlist_size: 25     # only the top N jobs hit the API per run
